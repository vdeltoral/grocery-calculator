<!doctype html>
<html lang="en" data-theme-key="grocery-calculator-theme">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Grocery Deal Calculator</title>
<meta name="description" content="Find the best per-pound deal across grocery items by comparing value per dollar." />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ec" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292c33" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" />
<link rel="stylesheet" href="ds/tokens.css" />
<link rel="stylesheet" href="ds/ds-core.css" />
<link rel="stylesheet" href="ds/ds.css" />
<link rel="stylesheet" href="app.css" />
<script src="ds/ds.js"></script>
</head>
<body>
<div class="app">
  <header class="app-bar">
    <span class="app-name">Grocery Deal Calculator</span>
    <div class="app-bar-end">
      <button type="button" class="btn btn-icon btn-subtle" data-theme-toggle aria-label="Theme"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <main class="app-main">
    <div class="page">
      <div class="card">
        <div class="field">
          <span class="field-label" id="category-label">Category</span>
          <div id="category-select"></div>
        </div>
        <div class="field">
          <span class="field-label" id="item-label">Item</span>
          <div id="item-select"></div>
        </div>
        <div class="field">
          <label class="field-label" for="price-input">Price per lb</label>
          <div class="price-wrap">
            <span class="prefix">$</span>
            <input class="input" id="price-input" type="text" inputmode="decimal" autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="table-wrap" id="results-card" hidden>
        <table class="table">
          <thead>
            <tr><th>Item</th><th class="num">Break-even</th><th class="num">Price</th></tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
